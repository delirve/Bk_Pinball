#config_version=6

coils:
  c_flipper_left_main:
    number: 0-0
    default_pulse_ms: 30
  c_flipper_left_hold:
    number: 0-1
    allow_enable: true
  c_flipper_right_main:
    number: 0-2
    default_pulse_ms: 30
  c_flipper_right_hold:
    number: 0-3
    allow_enable: true
  c_flipper_upper_main:
    number: 0-4
    default_pulse_ms: 30
  c_flipper_upper_hold:
    number: 0-5
    allow_enable: true
  c_slingshot_right:
    number: 0-6
    default_pulse_ms: 10
  c_slingshot_left:
    number: 0-7
    default_pulse_ms: 10
  # c_trough_eject:       # trough not installed; uncomment when wired
  #   number:

flippers:
  flipper_left:
    main_coil: c_flipper_left_main
    hold_coil: c_flipper_left_hold
    activation_switch: s_flipper_left
    eos_switch: s_flipper_left_eos
  flipper_right:
    main_coil: c_flipper_right_main
    hold_coil: c_flipper_right_hold
    activation_switch: s_flipper_right
    eos_switch: s_flipper_right_eos
  flipper_upper:
    main_coil: c_flipper_upper_main
    hold_coil: c_flipper_upper_hold
    activation_switch: s_flipper_upper
    eos_switch: s_flipper_upper_eos

autofire_coils:
  slingshot_left:
    coil: c_slingshot_left
    switch: s_slingshot_left
  slingshot_right:
    coil: c_slingshot_right
    switch: s_slingshot_right
